<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="brandTitle">Threads 过滤设置</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- 头部区域 -->
    <header class="header">
      <div class="brand">
        <svg class="threads-icon" viewBox="0 0 192 192" width="24" height="24">
          <circle cx="96" cy="96" r="88" fill="none" stroke="currentColor" stroke-width="12"/>
          <path d="M136 96c0-23-16-40-40-40s-40 17-40 40 16 40 40 40c14 0 26-7 33-18l-14-9c-4 7-11 11-19 11-13 0-23-9-24-21h62c1-4 2-8 2-13zm-64-5c1-11 10-19 24-19s22 8 23 19H72z" fill="currentColor"/>
        </svg>
        <div class="brand-text">
          <span class="brand-title" data-i18n="brandTitle">Threads 过滤</span>
          <span class="brand-sub" data-i18n="brandSub">关键词拦截助手</span>
        </div>
      </div>
      <div class="header-actions">
        <!-- 语言快捷切换 -->
        <select id="langSelect" class="lang-mini-select" title="Language">
          <option value="zh-CN">简</option>
          <option value="zh-TW">繁</option>
          <option value="en">EN</option>
          <option value="ja">日</option>
          <option value="ko">한</option>
        </select>
        <div class="toggle-wrapper">
          <label class="switch" data-i18n-title="masterToggleTitle">
            <input type="checkbox" id="masterToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </header>

    <!-- 过滤范围提示卡片 -->
    <div class="scope-card">
      <div class="scope-header">
        <span class="scope-title" data-i18n="scopeTitle">覆盖范围（统一关键词库）</span>
      </div>
      <div class="scope-badges">
        <span class="badge active" data-i18n="scopeUsername">👤 用户名</span>
        <span class="badge active" data-i18n="scopePost">📝 帖子正文</span>
        <span class="badge active" data-i18n="scopeComment">💬 评论区回复</span>
      </div>
      <div class="lang-support">
        <span data-i18n="langSupport">支持：简繁中文 · English · 日本語 · 한국어</span>
      </div>
    </div>

    <!-- 关键词输入添加 -->
    <div class="input-section">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="keywordInput" 
          data-i18n-placeholder="inputPlaceholder"
          placeholder="添加屏蔽词（按回车或点击添加）" 
          autocomplete="off"
          spellcheck="false"
        >
        <button id="addBtn" class="btn-primary" data-i18n="btnAdd">添加</button>
      </div>
      <div class="input-hint" data-i18n="inputHint">可输入多个词，使用逗号或空格分隔</div>
    </div>

    <!-- 常用预设推荐 -->
    <div class="preset-section">
      <span class="preset-title" data-i18n="presetTitle">热门推荐：</span>
      <div class="preset-tags" id="presetTags">
        <button class="preset-pill" data-word="买粉" data-i18n="presetBuyFans">买粉</button>
        <button class="preset-pill" data-word="兼职刷单" data-i18n="presetJobPart">兼职刷单</button>
        <button class="preset-pill" data-word="私信获取" data-i18n="presetDmMe">私信获取</button>
        <button class="preset-pill" data-word="虚拟币" data-i18n="presetCrypto">虚拟币</button>
        <button class="preset-pill" data-word="博彩" data-i18n="presetGamble">博彩</button>
        <button class="preset-pill" data-word="广告引流" data-i18n="presetTraffic">广告引流</button>
      </div>
    </div>

    <!-- 关键词列表区域 -->
    <div class="list-section">
      <div class="list-header">
        <span class="list-title"><span data-i18n="listTitle">已屏蔽关键词</span> (<span id="keywordCount">0</span>)</span>
        <div class="list-actions">
          <button id="batchBtn" class="btn-text" data-i18n="btnBatch">批量操作</button>
          <button id="clearAllBtn" class="btn-text danger" data-i18n="btnClearAll">清空</button>
        </div>
      </div>
      <div class="tags-container" id="tagsContainer">
        <!-- 动态生成的关键词标签 -->
        <div class="empty-state" id="emptyState" data-i18n="emptyKeywords">暂无关键词，在上方输入并添加</div>
      </div>
    </div>

    <!-- 批量操作弹层 -->
    <div class="modal" id="batchModal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <span data-i18n="batchModalTitle">批量编辑关键词</span>
          <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>
        <textarea id="batchTextarea" data-i18n-placeholder="batchPlaceholder" placeholder="每行一个关键词，或用逗号隔开..."></textarea>
        <div class="modal-footer">
          <button id="copyAllBtn" class="btn-secondary" data-i18n="btnCopyAll">复制全部</button>
          <button id="saveBatchBtn" class="btn-primary" data-i18n="btnSaveBatch">保存导入</button>
        </div>
      </div>
    </div>

    <!-- 选项配置与统计 -->
    <div class="settings-card">
      <div class="setting-row">
        <div class="setting-info">
          <div class="setting-name" data-i18n="tradSimpTitle">简繁互通识别</div>
          <div class="setting-desc" data-i18n="tradSimpDesc">输入简体自动拦截繁体，反之亦然</div>
        </div>
        <label class="switch small">
          <input type="checkbox" id="tradSimpToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="divider"></div>

      <!-- 拦截统计 -->
      <div class="stat-row">
        <div class="stat-item">
          <span class="stat-val" id="todayBlockedCount">0</span>
          <span class="stat-lbl" data-i18n="statToday">今日已移除</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-val" id="totalBlockedCount">0</span>
          <span class="stat-lbl" data-i18n="statTotal">累计已移除</span>
        </div>
        <div class="stat-actions">
          <button id="openStatsPageBtn" class="btn-icon" data-i18n-title="btnViewDetailStats" title="查看详细统计报表">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2">
              <path d="M18 20V10M12 20V4M6 20v-6"/>
            </svg>
          </button>
          <button id="resetStatBtn" class="btn-icon" title="重置计数">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 底部状态栏 -->
    <footer class="footer">
      <span class="status-msg" id="statusMsg" data-i18n="statusAutoSync">设置自动实时同步</span>
      <button id="rescanBtn" class="btn-refresh" title="立即在当前 Threads 页面重新扫描">
        <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="2">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
        </svg>
        <span data-i18n="btnRescan">重新扫描</span>
      </button>
    </footer>
  </div>

  <script src="../utils/text-normalizer.js"></script>
  <script src="../utils/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
