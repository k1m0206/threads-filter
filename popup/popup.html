<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="brandTitle">Threads伴侣</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- 头部区域 -->
    <header class="header">
      <div class="brand">
        <!-- 原创新版极简过滤器图标（绝非 'e'，现代圆角过滤符） -->
        <svg class="brand-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
          <line x1="7" y1="8" x2="17" y2="8"/>
          <line x1="9" y1="12" x2="15" y2="12"/>
          <line x1="11" y1="16" x2="13" y2="16"/>
        </svg>
        <div class="brand-text">
          <span class="brand-title" data-i18n="brandTitle">Threads伴侣</span>
          <span class="brand-sub" data-i18n="brandSub">ThreadsFilter</span>
        </div>
      </div>
      <div class="header-actions">
        <!-- 主题切换按钮 -->
        <button id="themeToggleBtn" class="btn-icon-square" data-i18n-title="themeToggleTitle" title="切换深浅色主题">
          <svg id="themeIconSun" class="icon-svg" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg id="themeIconMoon" class="icon-svg" viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" fill="none" stroke-width="2" style="display: none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <!-- 语言快捷切换 -->
        <select id="langSelect" class="lang-mini-select" title="Language">
          <option value="zh-CN">简</option>
          <option value="zh-TW">繁</option>
          <option value="en">EN</option>
          <option value="ja">日</option>
          <option value="ko">한</option>
        </select>
        <!-- 过滤总开关 -->
        <div class="toggle-wrapper">
          <label class="switch" data-i18n-title="masterToggleTitle">
            <input type="checkbox" id="masterToggle" checked>
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </header>

    <!-- 关键词输入添加 -->
    <div class="input-section">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="keywordInput" 
          data-i18n-placeholder="inputPlaceholder"
          placeholder="输入关键词，按回车添加" 
          autocomplete="off"
          spellcheck="false"
        >
        <button id="addBtn" class="btn-primary" data-i18n="btnAdd">添加</button>
      </div>
    </div>

    <!-- 关键词列表区域 -->
    <div class="list-section">
      <div class="list-header">
        <span class="list-title"><span data-i18n="listTitle">已屏蔽词</span> (<span id="keywordCount">0</span>)</span>
        <div class="list-actions">
          <button id="batchBtn" class="btn-text" data-i18n="btnBatch">批量</button>
          <button id="clearAllBtn" class="btn-text danger" data-i18n="btnClearAll">清空</button>
        </div>
      </div>
      <div class="tags-container" id="tagsContainer">
        <div class="empty-state" id="emptyState" data-i18n="emptyKeywords">暂无屏蔽词</div>
      </div>
    </div>

    <!-- 批量操作弹层 -->
    <div class="modal" id="batchModal" style="display: none;">
      <div class="modal-content">
        <div class="modal-header">
          <span data-i18n="batchModalTitle">批量编辑</span>
          <button id="closeModalBtn" class="close-btn">&times;</button>
        </div>
        <textarea id="batchTextarea" data-i18n-placeholder="batchPlaceholder" placeholder="每行一个关键词，或以逗号隔开..."></textarea>
        <div class="modal-footer">
          <button id="copyAllBtn" class="btn-secondary" data-i18n="btnCopyAll">复制</button>
          <button id="saveBatchBtn" class="btn-primary" data-i18n="btnSaveBatch">保存</button>
        </div>
      </div>
    </div>

    <!-- 简繁互通与拦截统计 -->
    <div class="settings-card">
      <div class="setting-row">
        <span class="setting-name" data-i18n="tradSimpTitle">简繁互通</span>
        <label class="switch small">
          <input type="checkbox" id="tradSimpToggle" checked>
          <span class="slider"></span>
        </label>
      </div>

      <div class="divider"></div>

      <!-- 拦截统计 -->
      <div class="stat-row">
        <div class="stat-item">
          <span class="stat-val" id="todayBlockedCount">0</span>
          <span class="stat-lbl" data-i18n="statToday">今日移除</span>
        </div>
        <div class="stat-sep"></div>
        <div class="stat-item">
          <span class="stat-val" id="totalBlockedCount">0</span>
          <span class="stat-lbl" data-i18n="statTotal">累计移除</span>
        </div>
        <div class="stat-actions">
          <button id="openStatsPageBtn" class="btn-icon" data-i18n-title="btnViewDetailStats" title="详细统计">
            <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2">
              <path d="M18 20V10M12 20V4M6 20v-6"/>
            </svg>
          </button>
          <button id="resetStatBtn" class="btn-icon" title="重置计数">
            <svg viewBox="0 0 24 24" width="13" height="13" stroke="currentColor" fill="none" stroke-width="2">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
              <path d="M3 3v5h5"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- 底部状态栏 -->
    <footer class="footer">
      <span class="status-msg" id="statusMsg"></span>
      <button id="rescanBtn" class="btn-refresh" title="重新扫描">
        <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" fill="none" stroke-width="2">
          <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.3"/>
        </svg>
        <span data-i18n="btnRescan">重新扫描</span>
      </button>
    </footer>
  </div>

  <script src="../utils/text-normalizer.js"></script>
  <script src="../utils/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
