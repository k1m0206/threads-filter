<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="statsPageTitle">Threads伴侣 - 统计中心</title>
  <link rel="stylesheet" href="stats.css">
</head>
<body>
  <div class="stats-container">
    <!-- 头部导航 -->
    <header class="header">
      <div class="header-left">
        <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5" ry="5"/>
          <line x1="7" y1="8" x2="17" y2="8"/>
          <line x1="9" y1="12" x2="15" y2="12"/>
          <line x1="11" y1="16" x2="13" y2="16"/>
        </svg>
        <div>
          <h1 class="header-title" data-i18n="statsHeaderTitle">过滤统计</h1>
          <p class="header-sub" data-i18n="statsHeaderSub">ThreadsFilter 过滤数据中心</p>
        </div>
      </div>
      <div class="header-right">
        <!-- 主题切换 -->
        <button id="themeToggleBtn" class="btn-icon-square" data-i18n-title="themeToggleTitle" title="切换深浅色主题">
          <svg id="themeIconSun" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg id="themeIconMoon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2" style="display: none;">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <!-- 语言选择 -->
        <select id="langSelect" class="select-dropdown">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
        </select>
        <button id="exportBtn" class="btn-secondary" data-i18n="btnExportStats">导出报表</button>
        <button id="clearStatsBtn" class="btn-danger" data-i18n="btnClearStats">清空数据</button>
      </div>
    </header>

    <!-- 数据总览卡片 -->
    <section class="overview-section">
      <div class="card stat-card">
        <span class="card-label" data-i18n="statCardTotal">累计总拦截</span>
        <span class="card-value" id="valTotalBlocked">0</span>
      </div>
      <div class="card stat-card">
        <span class="card-label" data-i18n="statCardToday">今日拦截</span>
        <span class="card-value" id="valTodayBlocked">0</span>
      </div>
      <div class="card stat-card">
        <span class="card-label" data-i18n="statCardKeywords">已生效词数</span>
        <span class="card-value" id="valActiveKeywords">0</span>
      </div>
      <div class="card stat-card">
        <span class="card-label" data-i18n="statCardMaxDay">单日峰值</span>
        <span class="card-value" id="valMaxDayBlocked">0</span>
      </div>
    </section>

    <!-- 近 14 天趋势图卡片 -->
    <section class="card chart-section">
      <div class="section-header">
        <h2 class="section-title" data-i18n="statsTrendTitle">14 天过滤趋势</h2>
      </div>
      <div class="chart-wrapper" id="trendChartWrapper">
        <svg id="trendSvg" class="trend-svg" viewBox="0 0 760 170" preserveAspectRatio="none"></svg>
      </div>
      <div class="chart-dates" id="trendDates"></div>
    </section>

    <!-- 下方两栏：左侧排行榜，右侧每日明细 -->
    <div class="two-column-layout">
      <section class="card rank-section">
        <div class="section-header">
          <h2 class="section-title" data-i18n="statsRankTitle">拦截排行 TOP 10</h2>
        </div>
        <div class="rank-list" id="rankList">
          <div class="empty-hint" data-i18n="noStatsData">暂无数据</div>
        </div>
      </section>

      <section class="card daily-section">
        <div class="section-header space-between">
          <h2 class="section-title" data-i18n="statsDailyDetailTitle">日明细</h2>
          <select id="dateSelect" class="select-dropdown">
            <option value="" data-i18n="selectDate">选择日期</option>
          </select>
        </div>
        <div class="daily-table-wrapper">
          <table class="daily-table">
            <thead>
              <tr>
                <th data-i18n="thKeyword">关键词</th>
                <th data-i18n="thCount">次数</th>
                <th data-i18n="thPercentage">占比</th>
              </tr>
            </thead>
            <tbody id="dailyTableBody">
              <tr>
                <td colspan="3" class="empty-hint" data-i18n="noStatsData">暂无数据</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script src="../utils/i18n.js"></script>
  <script src="stats.js"></script>
</body>
</html>
